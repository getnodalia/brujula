[package]
name = "brujula"
description = "Brújula, the Nodalix web browser: WebKit, vertical tabs, a built-in ad blocker and the Nodalia Design Language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "brujula"
path = "src/main.rs"

[dependencies]
brujula-core = { path = "../brujula-core" }
brujula-passkeys = { path = "../brujula-passkeys" }
nodalia-gtk = { git = "https://github.com/danielmigueltejedor/nodalia-design", rev = "78106607616f7db3eeaad90c8e0f1efac6f84684" }
nodalia-update = { git = "https://github.com/danielmigueltejedor/nodalia-design", rev = "114848a2ff1a7c29c9a5432fb12e955fbe0aeef2" }
webkit6 = "0.6"
soup3 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
base64 = "0.23"
zeroize = "1"
futures-channel = "0.3"
