[package]
name = "brujula-core"
description = "Brújula's logic without a UI: tab model, omnibox, ad-blocker lists and cosmetic filtering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
adblock = { version = "0.13", default-features = false, features = ["css-validation", "content-blocking", "embedded-domain-resolver", "full-regex-handling"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
base64 = "0.23"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = "0.11"
zeroize = { version = "1", features = ["derive"] }
rusqlite = { version = "0.43", features = ["bundled"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = "0.11"
hmac = "0.13"
